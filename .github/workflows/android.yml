
name: Build MotoRent APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v3

      - name: Descomprimir proyecto
        run: |
          mkdir proyecto
          unzip -q *.zip -d proyecto
          find proyecto -name settings.gradle.kts

      - name: Compilar APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
          arguments: assembleDebug
          build-root-directory: proyecto

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoRent-APK
          path: proyecto/app/build/outputs/apk/debug/app-debug.apk
          
